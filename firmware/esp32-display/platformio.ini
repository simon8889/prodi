[platformio]
default_envs = esp32dev
description = prodi focus display for the ESP32

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
lib_deps =
  olikraus/U8g2@^2.35.3
  Links2004/WebSockets@^2.7.3
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DBUILD_UNICODE
check_tool = cppcheck
check_flags = --enable=warning,style,performance,portability --inline-suppr

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
